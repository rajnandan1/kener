name: surface

# Tests the live demo at https://kener.ing, not the code of a pull request.
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  surface:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Run surface suites
        uses: rajnandan1/surface@v1
        with:
          runner: https://surface-production-2505.up.railway.app
          target: https://kener.ing
